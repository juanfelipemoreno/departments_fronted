<div class="card">
  <div class="card-header">
    <div class="content-left">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input 
        type="text" 
        placeholder="Search" 
      />
    </div>
    <button class="btn-primary">New</button>
    </div>
    <div>
      <div class="content-right">
        <button class="icon-btn">⊞</button>
        <button class="icon-btn">⬇</button>
        <button class="icon-btn">🖨</button>
      </div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Codigo</th>
        <th>Nombre</th>
        <th>Estado</th>
        <th>Opciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let department of departments">
        <td>{{ department.code }}</td>
        <td>{{ department.name }}</td>
        <td>
          <span
            class="badge"
            [class.active]="department.status"
            [class.inactive]="!department.status">
            {{ department.status ? 'Activo' : 'Inactivo' }}
          </span>
        </td>
        <td>
          <button class="btn-edit" routerLink="/departments/create">✏</button>
          <button class="btn-delete" [routerLink]="['/departments/edit', department.id]">🗑</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
